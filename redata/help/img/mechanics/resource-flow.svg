<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <title>How resources reach your stock</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a4a32"/>
    </marker>
    <style>
      .box { fill: #fbf6ea; stroke: #8a7350; stroke-width: 1.5; }
      .src { fill: #eef5e6; stroke: #6d8a4f; stroke-width: 1.5; }
      .stock { fill: #f6e7c1; stroke: #9b7a2e; stroke-width: 2.5; }
      .opt { fill: #f2f2f2; stroke: #8a8a8a; stroke-width: 1.2; stroke-dasharray: 5 3; }
      .line { stroke: #5a4a32; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #5a4a32; stroke-width: 1.4; fill: none; stroke-dasharray: 5 3; marker-end: url(#arrow); }
      .h { font-weight: bold; fill: #2e2618; }
      .t { fill: #3d3424; }
      .s { fill: #6a5d47; font-size: 12px; }
    </style>
  </defs>
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>

  <!-- sources -->
  <rect class="src" x="20" y="20" width="170" height="54" rx="6"/>
  <text class="h" x="35" y="42">Farm</text>
  <text class="s" x="35" y="61">food, one farmer each</text>
  <rect class="src" x="20" y="90" width="170" height="54" rx="6"/>
  <text class="h" x="35" y="112">Tree</text>
  <text class="s" x="35" y="131">wood, 95 to 300 each</text>
  <rect class="src" x="20" y="160" width="170" height="54" rx="6"/>
  <text class="h" x="35" y="182">Stone outcrop</text>
  <text class="s" x="35" y="201">1 stone = 2 materials</text>
  <rect class="src" x="20" y="230" width="170" height="54" rx="6"/>
  <text class="h" x="35" y="252">Gold outcrop</text>
  <text class="s" x="35" y="271">shrinks as it is mined</text>

  <!-- peasant -->
  <rect class="box" x="250" y="110" width="160" height="84" rx="6"/>
  <text class="h" x="265" y="134">Peasant</text>
  <text class="t" x="265" y="155">carries 10</text>
  <text class="s" x="265" y="174">12 or more after church</text>
  <line class="line" x1="190" y1="47" x2="250" y2="125"/>
  <line class="line" x1="190" y1="117" x2="250" y2="140"/>
  <line class="line" x1="190" y1="187" x2="250" y2="165"/>
  <line class="line" x1="190" y1="257" x2="250" y2="180"/>

  <!-- optional mills -->
  <rect class="opt" x="250" y="20" width="160" height="66" rx="6"/>
  <text class="h" x="262" y="42">Windmill / Sawmill</text>
  <text class="s" x="262" y="61">within 40 m on the way:</text>
  <text class="s" x="262" y="77">food or wood ×2 (×2.5)</text>
  <line class="dash" x1="330" y1="110" x2="330" y2="88"/>

  <!-- village -->
  <rect class="box" x="480" y="40" width="170" height="70" rx="6"/>
  <text class="h" x="495" y="64">Village</text>
  <text class="t" x="495" y="84">the village's own store</text>
  <text class="s" x="495" y="101">not yet yours to spend</text>
  <line class="line" x1="410" y1="135" x2="480" y2="90"/>

  <!-- cart -->
  <rect class="box" x="700" y="40" width="160" height="70" rx="6"/>
  <text class="h" x="715" y="64">Cart</text>
  <text class="t" x="715" y="84">carries up to 500</text>
  <line class="line" x1="650" y1="75" x2="700" y2="75"/>

  <!-- stock -->
  <rect class="stock" x="560" y="200" width="300" height="96" rx="8"/>
  <text class="h" x="578" y="226">Your stock (top bar)</text>
  <text class="t" x="578" y="248">delivered at the Manor, Keep, Castle,</text>
  <text class="t" x="578" y="267">Palace or a Stone Warehouse</text>
  <text class="s" x="578" y="286">food arrives less the upkeep penalty</text>
  <line class="line" x1="780" y1="110" x2="760" y2="200"/>
  <line class="line" x1="410" y1="170" x2="560" y2="235"/>

  <!-- shop -->
  <rect class="box" x="250" y="330" width="250" height="84" rx="6"/>
  <text class="h" x="265" y="354">Shop (shopkeeper)</text>
  <text class="t" x="265" y="375">1 materials from stock → 0.28 gold</text>
  <text class="s" x="265" y="394">×1.5 with a Bank within 60 m</text>
  <line class="line" x1="560" y1="272" x2="420" y2="330"/>
  <text class="s" x="440" y="290">materials</text>
  <line class="line" x1="500" y1="372" x2="620" y2="298"/>
  <text class="s" x="520" y="322">gold</text>

  <!-- merchant -->
  <rect class="box" x="560" y="350" width="300" height="84" rx="6"/>
  <text class="h" x="578" y="374">Merchant</text>
  <text class="t" x="578" y="395">trades at a Trading Post: more gold</text>
  <text class="t" x="578" y="414">the further the post from home</text>
  <line class="line" x1="760" y1="350" x2="760" y2="298"/>

  <text class="s" x="20" y="455">Spending always takes from your stock. Goods still in a village or a cart can be lost if it is destroyed.</text>
</svg>
