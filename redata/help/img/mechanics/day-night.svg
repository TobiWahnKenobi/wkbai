<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <title>A day in wkbai's day and night: sight and the peasants</title>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#1d2340"/>
      <stop offset="0.21" stop-color="#1d2340"/>
      <stop offset="0.27" stop-color="#f2c88a"/>
      <stop offset="0.32" stop-color="#cfe3f5"/>
      <stop offset="0.68" stop-color="#cfe3f5"/>
      <stop offset="0.73" stop-color="#f2b07a"/>
      <stop offset="0.79" stop-color="#1d2340"/>
      <stop offset="1" stop-color="#1d2340"/>
    </linearGradient>
    <style>
      .ax { stroke: #4d4535; stroke-width: 1.2; }
      .t { fill: #3d3424; }
      .s { fill: #5f5747; font-size: 12px; }
      .h { font-weight: bold; fill: #2b261c; }
      .curve { stroke: #b0452e; stroke-width: 2.5; fill: none; }
      .mark { stroke: #4d4535; stroke-width: 1.2; stroke-dasharray: 4 3; }
    </style>
  </defs>
  <rect x="0" y="0" width="900" height="330" fill="#ffffff"/>
  <text class="h" x="60" y="28">One day and night at the spring or autumn equinox (12 hours of daylight)</text>

  <!-- the sky band -->
  <rect x="60" y="45" width="780" height="40" fill="url(#sky)" stroke="#4d4535" stroke-width="1"/>
  <text x="80" y="70" fill="#e6e8f2" font-size="13">night</text>
  <text x="420" y="70" class="t" font-size="13">day</text>
  <text x="770" y="70" fill="#e6e8f2" font-size="13">night</text>

  <!-- sight factor plot: x = 60 + hour * 32.5, y = 260 - factor * 140 -->
  <line class="ax" x1="60" y1="260" x2="840" y2="260"/>
  <line class="ax" x1="60" y1="120" x2="60" y2="260"/>
  <text class="s" x="22" y="124">1.0</text>
  <text class="s" x="22" y="201">0.45</text>
  <line x1="56" y1="197" x2="64" y2="197" class="ax"/>
  <path class="curve" d="M60,197 L200,197 C230,197 240,120 265,120 L635,120 C660,120 670,197 700,197 L840,197"/>
  <text class="s" x="650" y="150" fill="#b0452e">sight range away from light</text>

  <!-- hours -->
  <g class="s">
    <text x="55" y="278">0</text>
    <text x="249" y="278">6</text>
    <text x="242" y="292">dawn</text>
    <text x="441" y="278">12</text>
    <text x="636" y="278">18</text>
    <text x="631" y="292">dusk</text>
    <text x="830" y="278">24</text>
    <text x="313" y="278">8</text>
    <text x="300" y="292">start (default)</text>
  </g>
  <line class="mark" x1="255" y1="45" x2="255" y2="260"/>
  <line class="mark" x1="645" y1="45" x2="645" y2="260"/>
  <line x1="320" y1="250" x2="320" y2="262" class="ax"/>

  <text class="s" x="660" y="238">peasants go indoors (when set)</text>
  <text class="s" x="80" y="238">peasants back to work at dawn</text>
  <text class="s" x="60" y="318">Within 20 m of a building (40 m of a fire) the full range applies. Fog ×0.5, rain ×0.8, snow ×0.65; never below 0.3.</text>
</svg>
