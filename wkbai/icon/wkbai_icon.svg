<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -12 540 540" width="512" height="512">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f6f8"/>
      <stop offset="0.45" stop-color="#a9b3bd"/>
      <stop offset="0.55" stop-color="#7d8893"/>
      <stop offset="1" stop-color="#d9dee3"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset="0.35" stop-color="#f2c14e"/>
      <stop offset="0.7" stop-color="#c48a1c"/>
      <stop offset="1" stop-color="#7a4f0c"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5a10"/>
      <stop offset="0.5" stop-color="#f6d270"/>
      <stop offset="1" stop-color="#8a5a10"/>
    </linearGradient>
    <radialGradient id="field" cx="0.42" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#c8283a"/>
      <stop offset="0.6" stop-color="#851220"/>
      <stop offset="1" stop-color="#3f0610"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#9ff6ff"/>
      <stop offset="0.6" stop-color="#22c4e8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#22c4e8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="shieldClip">
      <path d="M256 150 L380 182 L380 290 C380 372 322 430 256 462 C190 430 132 372 132 290 L132 182 Z"/>
    </clipPath>
  </defs>

  <!-- crossed swords behind the shield -->
  <g filter="url(#shadow)">
    <g id="sword" transform="rotate(-40 256 290) translate(0 46)">
      <!-- blade -->
      <path d="M248 40 L256 18 L264 40 L264 400 L248 400 Z" fill="url(#steel)" stroke="#3b444d" stroke-width="3"/>
      <path d="M256 26 L256 398" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>
      <!-- crossguard -->
      <rect x="206" y="398" width="100" height="16" rx="8" fill="url(#goldH)" stroke="#4a3006" stroke-width="3"/>
      <!-- grip -->
      <rect x="248" y="414" width="16" height="50" rx="4" fill="#4a2a14" stroke="#24130a" stroke-width="3"/>
      <path d="M248 424 L264 432 M248 438 L264 446 M248 452 L264 460" stroke="#7a4a26" stroke-width="3"/>
      <!-- pommel -->
      <circle cx="256" cy="474" r="13" fill="url(#gold)" stroke="#4a3006" stroke-width="3"/>
    </g>
    <use href="#sword" transform="translate(512 0) scale(-1 1)"/>
  </g>

  <!-- shield -->
  <g filter="url(#shadow)">
    <path d="M256 138 L394 172 L394 290 C394 382 330 444 256 478 C182 444 118 382 118 290 L118 172 Z"
          fill="url(#gold)" stroke="#3d2604" stroke-width="5"/>
    <path d="M256 150 L380 182 L380 290 C380 372 322 430 256 462 C190 430 132 372 132 290 L132 182 Z"
          fill="url(#field)" stroke="#2a0308" stroke-width="3"/>

    <!-- circuit traces on the field (the "AI") -->
    <g clip-path="url(#shieldClip)" fill="none" stroke="#f2c14e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
      <path d="M256 300 L256 250 L216 222 L216 190"/>
      <path d="M256 250 L296 222 L296 190"/>
      <path d="M256 300 L200 300 L176 324 L150 324"/>
      <path d="M256 300 L312 300 L336 324 L362 324"/>
      <path d="M256 300 L256 360 L226 390 L226 420"/>
      <path d="M256 360 L286 390 L286 420"/>
      <path d="M200 300 L180 276 L150 276"/>
      <path d="M312 300 L332 276 L362 276"/>
    </g>
    <g clip-path="url(#shieldClip)" fill="#f6d270" stroke="#5a3a06" stroke-width="3">
      <circle cx="216" cy="190" r="9"/><circle cx="296" cy="190" r="9"/>
      <circle cx="150" cy="324" r="9"/><circle cx="362" cy="324" r="9"/>
      <circle cx="226" cy="420" r="9"/><circle cx="286" cy="420" r="9"/>
      <circle cx="150" cy="276" r="9"/><circle cx="362" cy="276" r="9"/>
      <circle cx="256" cy="250" r="8"/><circle cx="256" cy="360" r="8"/>
      <circle cx="200" cy="300" r="7"/><circle cx="312" cy="300" r="7"/>
    </g>
    <!-- glowing core -->
    <circle cx="256" cy="300" r="58" fill="url(#core)"/>
    <circle cx="256" cy="300" r="26" fill="#0b2d3a" stroke="#f6d270" stroke-width="6"/>
    <circle cx="256" cy="300" r="13" fill="#bff8ff" filter="url(#glow)"/>

    <!-- shine -->
    <path d="M140 186 L256 157 L256 200 C210 205 170 220 140 250 Z" fill="#ffffff" opacity="0.10"/>
  </g>

  <!-- crown -->
  <g filter="url(#shadow)">
    <path d="M168 150 L150 66 L204 106 L256 38 L308 106 L362 66 L344 150 Z"
          fill="url(#gold)" stroke="#3d2604" stroke-width="5" stroke-linejoin="round"/>
    <rect x="162" y="140" width="188" height="30" rx="6" fill="url(#goldH)" stroke="#3d2604" stroke-width="5"/>
    <circle cx="150" cy="62" r="12" fill="url(#gold)" stroke="#3d2604" stroke-width="4"/>
    <circle cx="256" cy="34" r="14" fill="url(#gold)" stroke="#3d2604" stroke-width="4"/>
    <circle cx="362" cy="62" r="12" fill="url(#gold)" stroke="#3d2604" stroke-width="4"/>
    <!-- jewels -->
    <circle cx="256" cy="155" r="9" fill="#22c4e8" stroke="#0b2d3a" stroke-width="3"/>
    <circle cx="206" cy="155" r="7" fill="#c8283a" stroke="#3f0610" stroke-width="3"/>
    <circle cx="306" cy="155" r="7" fill="#c8283a" stroke="#3f0610" stroke-width="3"/>
    <path d="M256 70 L270 104 L256 124 L242 104 Z" fill="#22c4e8" stroke="#0b2d3a" stroke-width="3"/>
  </g>
</svg>
